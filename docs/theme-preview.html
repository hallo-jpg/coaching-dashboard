<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme-Vorschau · Coaching Dashboard</title>
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<style>
  :root {
    --ink:      #0b0807;
    --bar:      rgba(255,255,255,0.05);
    --bar-line: rgba(255,178,124,0.16);
    --txt:      #fdf4ec;
    --mut:      rgba(245,214,192,0.5);
    --brand:    #ff6b35;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--txt);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    display: flex; flex-direction: column;
  }
  .bar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px;
    background: linear-gradient(180deg, rgba(255,107,53,0.10), rgba(255,107,53,0.02)), #0b0807;
    border-bottom: 1px solid var(--bar-line);
  }
  .bar-icon { width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0; }
  .bar-title { font-size: 0.78rem; font-weight: 800; letter-spacing: -0.2px; white-space: nowrap; }
  .bar-title span { color: var(--mut); font-weight: 600; }

  .seg { display: flex; gap: 4px; background: rgba(255,255,255,0.05); border: 1px solid var(--bar-line); border-radius: 10px; padding: 3px; }
  .seg button {
    appearance: none; border: 0; cursor: pointer;
    background: transparent; color: var(--mut);
    font: inherit; font-size: 0.7rem; font-weight: 700;
    padding: 5px 11px; border-radius: 7px; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .seg button:hover { color: var(--txt); }
  .seg button[aria-pressed="true"] { background: linear-gradient(135deg, #ffa445, #e03e12); color: #fff; box-shadow: 0 2px 10px rgba(224,62,18,0.35); }
  .seg button[aria-pressed="true"][data-theme="none"] { background: rgba(255,255,255,0.14); color: var(--txt); box-shadow: none; }
  .seg button[aria-pressed="true"][data-theme="sunrise"] { background: linear-gradient(135deg, #fff2e2, #ffb066); color: #3a1c0c; }

  .swatches { display: flex; gap: 5px; margin-left: auto; align-items: center; }
  .sw { width: 15px; height: 15px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.14); }
  .hint { font-size: 0.6rem; color: var(--mut); }

  .stage { flex: 1 1 auto; position: relative; min-height: 0; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--ink); }

  .note {
    position: absolute; left: 50%; top: 40px; transform: translateX(-50%);
    max-width: 480px; padding: 14px 18px; border-radius: 12px;
    background: rgba(224,62,18,0.12); border: 1px solid rgba(255,140,80,0.3);
    font-size: 0.75rem; line-height: 1.5; display: none;
  }
  @media (max-width: 720px) {
    .bar { gap: 8px; padding: 8px 10px; }
    .bar-title { display: none; }
    .swatches { display: none; }
    .seg button { padding: 5px 9px; font-size: 0.66rem; }
  }
</style>
</head>
<body>

<div class="bar">
  <img class="bar-icon" src="icon.svg?v=2" alt="">
  <div class="bar-title">Theme-Vorschau <span>· Live-Dashboard</span></div>

  <div class="seg" role="group" aria-label="Theme wählen">
    <button data-theme="none"    aria-pressed="true">Jetzt</button>
    <button data-theme="ember"   aria-pressed="false">Ember</button>
    <button data-theme="ignite"  aria-pressed="false">Ignite</button>
    <button data-theme="sunrise" aria-pressed="false">Sunrise</button>
  </div>

  <div class="swatches" aria-hidden="true">
    <div class="sw" style="background:#ffa445"></div>
    <div class="sw" style="background:#ff6b35"></div>
    <div class="sw" style="background:#e03e12"></div>
    <div class="sw" style="background:#0d1420"></div>
    <div class="hint">Favicon-Palette</div>
  </div>
</div>

<div class="stage">
  <iframe id="dash" src="dashboard.html" title="Dashboard"></iframe>
  <div class="note" id="note"></div>
</div>

<script>
(function () {

  /* ──────────────────────────────────────────────────────────────────
     Der Generator schreibt viele Farben fest ins HTML (Ring-Gradients,
     Chart-Striche, Inline-Styles). Die Map unten uebersetzt jeden dieser
     Hexwerte pro Theme in ein warmes Pendant der Favicon-Palette.
     Spalten: [ Ember, Ignite, Sunrise ]
     ────────────────────────────────────────────────────────────────── */
  var MAP = {
    /* Semantik */
    '#22c55e': ['#6cc07a','#7ec86a','#2f9e50'],   /* gruen / ok        */
    '#16a34a': ['#2f8f4f','#2f8f4f','#1f7a3c'],
    '#86efac': ['#9fe08a','#a6e88f','#5cc47a'],
    '#3ecf8e': ['#6cc07a','#7ec86a','#1f7a3c'],
    '#f5a623': ['#ffa445','#ffb545','#a4540b'],   /* gelb / achtung    */
    '#f59e0b': ['#ffa445','#ffb545','#a4540b'],
    '#eab308': ['#ffa445','#ffb545','#a4540b'],
    '#facc15': ['#ffbe55','#ffc46b','#a4540b'],
    '#ef4444': ['#e8543a','#e03e12','#c62f10'],   /* rot / stopp       */
    '#dc2626': ['#c9351a','#c9351a','#a82208'],
    /* CTL-Ring (war violett) */
    '#a78bfa': ['#ffc98a','#ffd9a0','#ffab5e'],
    '#5b21b6': ['#b35a12','#e03e12','#e03e12'],
    '#c4b5fd': ['#ffc98a','#ffd9a0','#ffab5e'],
    /* ATL-Ring (war rot) */
    '#f87171': ['#ff8f6a','#ff7a52','#d9552c'],
    '#991b1b': ['#7a1c05','#8c1f06','#8c1f06'],
    '#fca5a5': ['#ff8f6a','#ff7a52','#d9552c'],
    /* TSS-Ring (war tuerkis) */
    '#2dd4bf': ['#ff8a3c','#ffa445','#b4530e'],
    '#0d9488': ['#c2410c','#e03e12','#c2410c'],
    '#5eead4': ['#ffb56b','#ffa445','#ff8f4d'],
    /* Zonen: LIT gruen · Grauzone amber · MIT orange · HIT ember */
    '#3b82f6': ['#ff8a3c','#ff6b35','#c2410c'],
    '#a855f7': ['#e03e12','#e03e12','#a82208'],
    '#60a5fa': ['#ffb066','#ffc07a','#b4530e'],
    '#38bdf8': ['#ffc08a','#ffd0a6','#96450c'],
    '#4fc3f7': ['#ffc08a','#ffd0a6','#96450c'],
    '#7986cb': ['#e0955c','#ffb066','#b4530e'],
    /* Orange-Toene des Generators auf die Icon-Farben ziehen */
    '#f97316': ['#ff6b35','#ff6b35','#d2590c'],
    '#fb923c': ['#ffa445','#ffb066','#c2620a'],
    '#4ade80': ['#9fe08a','#a6e88f','#2f9e50'],
    /* Neutrale Slate-Toene → warmes Taupe */
    '#94a3b8': ['#c2a894','#ffa77d','#8a5a41'],
    '#e2e8f0': ['#f3ddcb','#ffd9c0','#3a2015'],
    '#cbd5e1': ['#e6cdb9','#ffcbab','#4a2a1c'],
    '#64748b': ['#8a6d5c','#a3806a','#7a5a48'],
    '#475569': ['#4a352c','#5a3a2c','#c9b3a4'],
    '#1e293b': ['#241612','#2a1410','#f0e2d6'],
    '#1a1a1a': ['#2a1a14','#2a1512','#ecdccd']
  };

  function recolor(i, trackColor) {
    var css = '';
    for (var hex in MAP) {
      var to = MAP[hex][i];
      css += '[stroke="' + hex + '"]{stroke:' + to + '}\n';
      css += '[fill="' + hex + '"]{fill:' + to + '}\n';
      css += '[stop-color="' + hex + '"]{stop-color:' + to + '}\n';
      css += '[style*="' + hex + '"]{color:' + to + ' !important}\n';
      css += '[style*="background:' + hex + '"],[style*="background: ' + hex + '"],'
           + '[style*="background-color:' + hex + '"]{background:' + to + ' !important}\n';
      css += '[style*="border-color:' + hex + '"]{border-color:' + to + ' !important}\n';
    }
    css += 'circle[stroke="rgba(255,255,255,0.07)"]{stroke:' + trackColor + '}\n';
    css += '.rbar-track,.polar-track{background:' + trackColor + '}\n';
    return css;
  }

  /* ── EMBER · warm & zurueckhaltend ────────────────────────────────── */
  var EMBER = `
    :root {
      --green:#6cc07a; --yellow:#ffa445; --red:#e8543a; --orange:#ff6b35;
      --purple:#ffa445; --teal:#ff8a3c; --blue:#ffb066;
      --text:#fdf4ec; --muted:rgba(245,214,192,0.46);
      --border:rgba(255,178,124,0.12);
      --bg:#0b0807; --surface:rgba(255,190,150,0.05); --surface2:rgba(255,190,150,0.07);
      --accent:#c2a894; --subtle:rgba(255,220,200,0.13);
    }
    body {
      background:
        radial-gradient(ellipse 80% 60% at 15%  8%, rgba(255,107,53,0.22) 0%, transparent 55%),
        radial-gradient(ellipse 55% 45% at 88% 18%, rgba(224,62,18,0.15)  0%, transparent 50%),
        radial-gradient(ellipse 50% 55% at 50% 85%, rgba(255,164,69,0.09) 0%, transparent 55%),
        radial-gradient(ellipse 65% 35% at  8% 75%, rgba(224,62,18,0.08)  0%, transparent 50%),
        #0b0807 !important;
    }
    .g,.countdown-card-main,.countdown-card-secondary,.ring-card,
    .week-card,.readiness-card,.polar-card,.ausblick-card {
      background: rgba(255,186,140,0.05);
      border: 1px solid rgba(255,178,124,0.13);
      box-shadow: 0 1px 0 rgba(255,220,190,0.08) inset, 0 8px 32px rgba(40,10,0,0.40);
    }
    .phase-pill{background:rgba(255,107,53,0.14);border-color:rgba(255,107,53,0.28);color:#ffa445}
    .phase-pill .dot{background:#ff6b35}
    .phase.active{background:rgba(255,107,53,0.14);border-color:rgba(255,107,53,0.30);color:#ffa445;box-shadow:0 0 14px rgba(255,107,53,0.16)}
    .phase.done{background:rgba(108,192,122,0.07);border-color:rgba(108,192,122,0.12);color:rgba(108,192,122,0.5)}
    .tag-key{background:rgba(255,107,53,0.16);color:#ffa445}
    .tag-koff{background:rgba(255,138,60,0.12);color:#ff8a3c}
    .kw-pill{background:rgba(255,178,124,0.10);color:#c2a894}
    .card-headline{border-left-color:#ff6b35}
    .cd-raceplan-btn{background:rgba(255,107,53,0.12);border-color:rgba(255,107,53,0.30);color:#ffa445}
    .day-fuel{color:#7fae6a}
  ` + recolor(0, 'rgba(255,220,190,0.09)');

  /* ── IGNITE · Favicon pur ─────────────────────────────────────────── */
  var IGNITE = `
    :root {
      --green:#7ec86a; --yellow:#ffb545; --red:#e03e12; --orange:#ff6b35;
      --purple:#ff8f4d; --teal:#ffa445; --blue:#ffc07a;
      --text:#fff4ea; --muted:rgba(255,205,175,0.50);
      --border:rgba(255,140,80,0.16);
      --bg:#0a0506; --surface:rgba(255,140,80,0.07); --surface2:rgba(255,140,80,0.10);
      --accent:#ffa77d; --subtle:rgba(255,200,170,0.16);
    }
    body {
      background:
        radial-gradient(ellipse 95% 75% at 10% -8%, rgba(255,164,69,0.40) 0%, transparent 58%),
        radial-gradient(ellipse 75% 60% at 94% 10%, rgba(224,62,18,0.30)  0%, transparent 56%),
        radial-gradient(ellipse 60% 60% at 50% 98%, rgba(255,107,53,0.18) 0%, transparent 60%),
        #0a0506 !important;
    }
    .g,.countdown-card-main,.countdown-card-secondary,.ring-card,
    .week-card,.readiness-card,.polar-card,.ausblick-card {
      background: linear-gradient(160deg, rgba(255,164,69,0.12), rgba(255,107,53,0.05) 45%, rgba(255,255,255,0.03));
      border: 1px solid rgba(255,140,80,0.24);
      box-shadow: 0 1px 0 rgba(255,210,170,0.16) inset, 0 10px 40px rgba(120,25,0,0.40);
    }
    /* Favicon als Markenzeichen im Header */
    .header-title{display:flex;align-items:center;gap:10px}
    .header-title::before{
      content:'';width:28px;height:28px;border-radius:8px;flex-shrink:0;
      background:url('icon.svg?v=2') center/cover no-repeat;
      box-shadow:0 3px 12px rgba(224,62,18,0.45);
    }
    .header-title{
      background:linear-gradient(135deg,#ffd9a0 0%,#ffa445 45%,#ff6b35 100%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .phase-pill{background:linear-gradient(135deg,rgba(255,164,69,0.28),rgba(224,62,18,0.22));border-color:rgba(255,164,69,0.45);color:#ffd0a6}
    .phase-pill .dot{background:#ffa445;box-shadow:0 0 8px #ff6b35}
    .phase.active{background:linear-gradient(135deg,rgba(255,164,69,0.26),rgba(224,62,18,0.18));border-color:rgba(255,164,69,0.45);color:#ffd0a6;box-shadow:0 0 18px rgba(255,107,53,0.28)}
    .phase.done{background:rgba(126,200,106,0.07);border-color:rgba(126,200,106,0.14);color:rgba(126,200,106,0.5)}
    .tag-key{background:linear-gradient(135deg,rgba(255,164,69,0.28),rgba(224,62,18,0.20));color:#ffd0a6}
    .tag-koff{background:rgba(255,164,69,0.14);color:#ffa445}
    .kw-pill{background:rgba(255,140,80,0.16);color:#ffb98e}
    .card-headline{border-left:3px solid transparent;border-image:linear-gradient(180deg,#ffa445,#e03e12) 1}
    .chard-icon{background:linear-gradient(135deg,#ffa445,#e03e12)}
    .cd-raceplan-btn{background:linear-gradient(135deg,rgba(255,164,69,0.24),rgba(224,62,18,0.18));border-color:rgba(255,164,69,0.45);color:#ffd0a6}
    .ring-num{text-shadow:0 0 22px rgba(255,107,53,0.35)}
    .day-fuel{color:#8cbb6a}
    footer{border-top-color:rgba(255,140,80,0.16)}
  ` + recolor(1, 'rgba(255,200,170,0.11)');

  /* ── SUNRISE · hell, Icon invertiert ──────────────────────────────── */
  var SUNRISE = `
    :root {
      --green:#2f9e50; --yellow:#c2620a; --red:#c62f10; --orange:#e03e12;
      --purple:#d2590c; --teal:#b4530e; --blue:#9a4a12;
      --text:#26140e; --muted:rgba(90,55,40,0.62);
      --border:rgba(120,60,30,0.14);
      --bg:#fdf5ee; --surface:rgba(255,255,255,0.7); --surface2:rgba(255,255,255,0.85);
      --accent:#8a5a41; --subtle:rgba(80,45,30,0.30);
    }
    body {
      background:
        radial-gradient(ellipse 80% 60% at 12%  4%, rgba(255,164,69,0.45) 0%, transparent 58%),
        radial-gradient(ellipse 60% 50% at 92% 14%, rgba(224,62,18,0.22)  0%, transparent 55%),
        radial-gradient(ellipse 60% 55% at 50% 96%, rgba(255,107,53,0.16) 0%, transparent 58%),
        #fdf5ee !important;
      color:#26140e;
    }
    .g,.countdown-card-main,.countdown-card-secondary,.ring-card,
    .week-card,.readiness-card,.polar-card,.ausblick-card {
      background: rgba(255,252,249,0.80);
      border: 1px solid rgba(180,90,40,0.14);
      box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset, 0 10px 30px rgba(120,60,25,0.10);
    }
    .header-title{color:#1d0f0a}
    .phase-pill{background:rgba(224,62,18,0.10);border-color:rgba(224,62,18,0.26);color:#b83a10}
    .phase-pill .dot{background:#e03e12}
    .phase.active{background:rgba(224,62,18,0.10);border-color:rgba(224,62,18,0.26);color:#b83a10;box-shadow:none}
    .phase.done{background:rgba(47,158,80,0.08);border-color:rgba(47,158,80,0.18);color:rgba(30,110,55,0.75)}
    .phase.upcoming{background:rgba(120,60,30,0.05);border-color:rgba(120,60,30,0.10);color:rgba(90,55,40,0.5)}
    .phase.open{background:rgba(194,98,10,0.06);border-color:rgba(194,98,10,0.35);color:rgba(140,70,8,0.9)}
    .tag-key{background:rgba(224,62,18,0.12);color:#b83a10}
    .tag-run{background:rgba(47,158,80,0.12);color:#1f7a3c}
    .tag-ka{background:rgba(194,98,10,0.14);color:#a4540b}
    .tag-koff{background:rgba(180,83,14,0.12);color:#96450c}
    .kw-pill{background:rgba(120,60,30,0.09);color:#7a4a33}
    .tss-pill{background:rgba(120,60,30,0.07)}
    .card-headline{border-left-color:#e03e12}
    .cd-race-name,.cd-day-detail,.day-meal{color:#5a3728}
    .day-fuel{color:#2f7a4b}
    .spark-today{outline-color:rgba(120,60,30,0.35)}
    .badge-missed{background:rgba(120,60,30,0.07);border-color:rgba(120,60,30,0.14)}
    .cd-raceplan-btn{background:rgba(224,62,18,0.10);border-color:rgba(224,62,18,0.28);color:#b83a10}
    .sick-notice{background:rgba(198,47,16,0.08);border-color:rgba(198,47,16,0.22)}
    footer{border-top-color:rgba(120,60,30,0.14)}
  ` + recolor(2, 'rgba(120,60,30,0.12)');

  var THEMES = { none: '', ember: EMBER, ignite: IGNITE, sunrise: SUNRISE };
  var KEY = 'coach_theme_preview';
  var current = localStorage.getItem(KEY) || 'none';
  var frame = document.getElementById('dash');
  var note  = document.getElementById('note');

  function apply(name) {
    var doc;
    try { doc = frame.contentDocument; } catch (e) { doc = null; }
    if (!doc || !doc.head) {
      note.style.display = 'block';
      note.textContent = 'Vorschau braucht denselben Origin – bitte ueber die GitHub-Pages-URL oeffnen, nicht als lokale Datei.';
      return;
    }
    note.style.display = 'none';
    var tag = doc.getElementById('__theme_override');
    if (!tag) {
      tag = doc.createElement('style');
      tag.id = '__theme_override';
      doc.head.appendChild(tag);
    }
    tag.textContent = THEMES[name] || '';
    document.documentElement.style.background = (name === 'sunrise') ? '#fdf5ee' : '#0b0807';
  }

  function select(name) {
    current = name;
    localStorage.setItem(KEY, name);
    document.querySelectorAll('.seg button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.theme === name));
    });
    apply(name);
  }

  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () { select(b.dataset.theme); });
  });

  frame.addEventListener('load', function () { select(current); });
  select(current);
})();
</script>

</body>
</html>
