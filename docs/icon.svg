<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="45%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-18%" y="-18%" width="136%" height="136%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dot-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="#070b11"/>

  <!-- Fill area under curve -->
  <path d="M 68,408 C 130,402 200,348 258,282 C 314,218 378,150 448,102 L 448,430 L 68,430 Z"
    fill="url(#fill)"/>

  <!-- Glow layer -->
  <path d="M 68,408 C 130,402 200,348 258,282 C 314,218 378,150 448,102"
    fill="none" stroke="url(#curve)" stroke-width="40" stroke-linecap="round"
    filter="url(#glow)" opacity="0.6"/>

  <!-- Main curve -->
  <path d="M 68,408 C 130,402 200,348 258,282 C 314,218 378,150 448,102"
    fill="none" stroke="url(#curve)" stroke-width="24" stroke-linecap="round"/>

  <!-- Endpoint dot with glow -->
  <circle cx="448" cy="102" r="32" fill="#22c55e" filter="url(#dot-glow)" opacity="0.7"/>
  <circle cx="448" cy="102" r="22" fill="#22c55e"/>
  <circle cx="448" cy="102" r="10" fill="#f0fff4"/>
</svg>
